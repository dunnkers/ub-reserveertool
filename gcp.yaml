---
    kind: Service
    apiVersion: v1
    metadata:
      name: ub-backend
    spec:
      selector:
        app: ub-backend
      ports:
        - protocol: "TCP"
          port: 3001
          targetPort: 3001
      type: LoadBalancer
      sessionAffinity: "ClientIP"
    
    
---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ub-backend
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ub-backend
      template:
        metadata:
          labels:
            app: ub-backend
        spec:
          containers:
            - name: ub-backend
              image: dunnkers/ub-reserveertool:backend
              imagePullPolicy: "Always"
              ports:
                - containerPort: 3001
              env:
              - name: REDIS_ROOT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: redis-password
                    name: my-redis
              - name: REDIS_IP
                value: my-redis-headless
  